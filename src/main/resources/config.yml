# Every other setting is registered by ConfigService and written to the server's
# config.yml the first time the plugin runs; this file only carries what an
# existing installation must be able to fall back to. Bukkit registers it as the
# defaults for plugins/MedievalEconomy/config.yml, so a key missing from the
# file on disk is read from here.

# Usage reporting. When the plugin is enabled, and each time one of its
# commands is used, a small event (plugin name, event name, plugin version)
# is sent to the author's trace server so it is known which plugins are
# actually in use. Nothing about players or the server is included. Sending
# happens off the main thread, never blocks a tick, and is dropped silently
# if the server cannot be reached. Set enabled to false to turn it off.
#
# Other ways to turn it off, which win over the setting below:
#   - for every plugin on this server that reports to trace: enabled: false in
#     plugins/trace/config.yml (written by the first such plugin to start)
#   - environment variable TRACE_USAGE_REPORTING=off or DO_NOT_TRACK=1
# The plugin says on every startup whether reporting is on. Details:
# https://github.com/Stephenson-Software/trace#usage-reporting
usage-reporting:
  enabled: true
  endpoint: https://trace.danielstephenson.dev
  # The key identifies this plugin to the trace server, so reports are
  # attributed to MedievalEconomy and can be revoked as a group if they are ever
  # abused. It is not a secret -- it ships in this file on every server that
  # runs the plugin -- and it cannot do anything except report as this
  # plugin. Empty means reporting is off regardless of the switch above.
  key: "v9jS7yhG5qIdX8rvSNGNTJvfIHQMe5jPy4Xt5J0UBpA"
